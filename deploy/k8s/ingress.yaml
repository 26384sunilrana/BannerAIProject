# One host: /api goes to the API, everything else to the web app. Build the web image with
# NEXT_PUBLIC_API_URL=https://<host>/api so the browser calls the same origin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banner
  namespace: bannerai
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 512m   # large media uploads
spec:
  ingressClassName: nginx
  tls:
    - hosts: [banners.example.com]
      secretName: banner-tls
  rules:
    - host: banners.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: banner-api, port: { number: 80 } }
          - path: /
            pathType: Prefix
            backend:
              service: { name: banner-web, port: { number: 80 } }
