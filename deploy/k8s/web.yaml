apiVersion: apps/v1
kind: Deployment
metadata:
  name: banner-web
  namespace: bannerai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banner-web
  template:
    metadata:
      labels:
        app: banner-web
    spec:
      containers:
        - name: web
          image: bannerai/banner-web:latest
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: banner-web
  namespace: bannerai
spec:
  selector:
    app: banner-web
  ports:
    - port: 80
      targetPort: 3000
