name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: dotnet build src/BannerService --configuration Release
      - name: Domain tests
        run: dotnet test tests/BannerService.Domain.Tests --configuration Release
      - name: Application tests
        run: dotnet test tests/BannerService.Application.Tests --configuration Release
      - name: Integration tests (in-memory database)
        run: dotnet test tests/BannerService.IntegrationTests --configuration Release

  api-sql:
    name: Integration tests on SQL Server
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Ci-Only-Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Only-Passw0rd!' -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Same tests against real SQL Server (migrations included)
        env:
          SMOKE_SQL: "Server=localhost,1433;Database=BannerCi;User ID=sa;Password=Ci-Only-Passw0rd!;TrustServerCertificate=true"
        run: dotnet test tests/BannerService.IntegrationTests --configuration Release

  web:
    name: Web type check, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/BannerUI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/BannerUI/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
      - name: Build
        run: npm run build
